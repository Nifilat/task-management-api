# Values come from a .env file next to this file (copy .env.example to .env and fill in DB_PASSWORD and JWT_SECRET).
services:
  postgres-db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-taskmanager}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-taskmanager}
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskmanager} -d ${DB_NAME:-taskmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  database-migrations:
    image: migrate/migrate
    depends_on:
        postgres-db:
          condition: service_healthy
    volumes:
        - ./database-migrations/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${DB_USER:-taskmanager}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME:-taskmanager}?sslmode=disable", "-verbose", "up"]

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - database-migrations
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-taskmanager}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-taskmanager}
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
